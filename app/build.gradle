apply plugin: 'com.android.application'

// IDs reales de AdMob (release). Debug usa los IDs de prueba oficiales de Google.
def admobAppIdRelease          = "ca-app-pub-8474453660271942~4393829714"
def admobBannerIdRelease       = "ca-app-pub-8474453660271942/9184800934"
def admobInterstitialIdRelease = "ca-app-pub-8474453660271942/1150495372"

android {
    namespace 'com.exoapp'
    compileSdk = 37
    defaultConfig {
        applicationId 'com.exofpune'
        minSdk 24
        targetSdk 37
        versionCode 24
        versionName "2.0.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = true
    }
    buildTypes {
        release {
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled true
            // Enables resource shrinking, which is performed by the Android Gradle plugin.
            shrinkResources true

            manifestPlaceholders = [admobAppId: admobAppIdRelease]
            resValue "string", "admob_banner_id", admobBannerIdRelease
            resValue "string", "admob_interstitial_id", admobInterstitialIdRelease

            // Includes the default ProGuard rules files that are packaged with
            // the Android Gradle plugin. To learn more, go to the section about
            // R8 configuration files.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            //proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            //signingConfig signingConfigs.config
        }

        debug {
            // ID de app de PRUEBA oficial de Google, para no usar anuncios reales mientras desarrollas
            manifestPlaceholders = [admobAppId: "ca-app-pub-3940256099942544~3347511713"]
            resValue "string", "admob_banner_id", "ca-app-pub-3940256099942544/6300978111"
            resValue "string", "admob_interstitial_id", "ca-app-pub-3940256099942544/1033173712"
        }
    }
    buildFeatures {
        resValues true // necesario para los resValue de AdMob (admob_banner_id / admob_interstitial_id)
    }
    productFlavors {
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.readystatesoftware.sqliteasset:sqliteassethelper:2.0.1'
    testImplementation 'junit:junit:4.13.2'
}
